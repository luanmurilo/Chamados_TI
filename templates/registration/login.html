<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Chamados TI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            background: #1e293b;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #475569;
            border-radius: 8px;

            background: #0f172a;
            color: #fff;

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #6366f1;
        }

        .btn-login {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #6366f1;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .btn-login:hover {
            background: #4f46e5;
        }

        .error {
            background: #7f1d1d;
            color: #fecaca;

            padding: 10px;
            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px;
            }

            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <h1>Chamados TI</h1>
                <p>Acesso ao sistema</p>
            </div>

            {% if form.errors %}
                <div class="error">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="form-group">
                    <label for="id_username">
                        Usuário
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        placeholder="Digite seu usuário"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="id_password">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>

            </form>

        </div>

    </div>

</body>

</html>
