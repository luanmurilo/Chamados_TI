<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chamados TI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        header {
            background: #1e293b;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 22px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info span {
            color: #94a3b8;
        }

        .logout {
            color: white;
            background: #dc2626;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 7px;
        }

        .logout:hover {
            background: #b91c1c;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #94a3b8;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: #6366f1;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
        }

        .btn:hover {
            background: #4f46e5;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            header h1 {
                font-size: 18px;
            }

            .user-info span {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Chamados TI</h1>

        <div class="user-info">

            <span>
                Olá, {{ request.user.username }}
            </span>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}

                <button
                    type="submit"
                    style="
                        background: none;
                        border: none;
                        color: #cbd5e1;
                        cursor: pointer;
                        font-size: 16px;
                    "
                >
                    Sair
                </button>
            </form>

        </div>

    </header>

    <main>

        <div class="welcome">

            <h2>Bem-vindo ao sistema</h2>

            <p>
                Gerencie seus chamados de suporte de TI.
            </p>

        </div>

        <div class="cards">

            <div class="card">

                <h3>📋 Abrir chamado</h3>

                <p>
                    Registre uma nova solicitação para a equipe de TI.
                </p>

                <a href="{% url 'abrir_chamado' %}" class="btn">
                    Abrir chamado
                </a>

            </div>

            <div class="card">

                <h3>🔎 Meus chamados</h3>

                <p>
                    Consulte os chamados que você abriu.
                </p>

                <a href="{% url 'meus_chamados' %}" class="btn">
                    Ver chamados
                </a>

            </div>

        </div>

    </main>

</body>

</html>
